<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Redirigiendo…</title>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var last = parts[parts.length - 1];
      var slugs = ['sol', 'viento', 'lluvia', 'nubes', 'niebla', 'apocalipsis', '3-dias'];
      var i = slugs.indexOf(last);
      if (i !== -1) {
        parts.pop();
        var base = parts.length ? '/' + parts.join('/') + '/' : '/';
        location.replace(base + 'tiempo-coruna.html#/' + slugs[i]);
        return;
      }
      var dir = location.pathname.replace(/\/[^/]*$/, '/');
      location.replace(dir + 'tiempo-coruna.html');
    })();
  </script>
</head>
<body></body>
</html>
